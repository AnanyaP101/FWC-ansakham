<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        table {
            width: 100%;
            height: 100vh;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 1px solid black;
            color: white;
            text-align: center;
            overflow-wrap: break-word;
        }

        td:nth-child(1) {
            background-color: rgb(0, 6, 118);
        }

        td:nth-child(2) {
            background-color: rgb(211, 0, 0);
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td>First cell</td>
            <td>Second cell</td>
        </tr>
    </table>

</body>
</html>
