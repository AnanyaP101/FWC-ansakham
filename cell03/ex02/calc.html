<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="calc.css">
</head>

<body>

    <input type="text" id="left" placeholder="Number">

    <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
        <option value="%">%</option>
    </select>

    <input type="text" id="right" placeholder="Number">

    <input type="submit" value="Try me!" onclick="calculate()">

    <script src="calc.js"></script>

</body>
</html>
